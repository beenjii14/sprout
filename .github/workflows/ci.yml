name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew list jq >/dev/null 2>&1 || brew install jq
      - name: Run test suite
        run: zsh tests/run.zsh

  lint:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck installers
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck zsh
          shellcheck -S warning install.sh uninstall.sh
      - name: Parse the plugin with zsh
        run: zsh -n sprout.plugin.zsh && zsh -n tests/run.zsh
